[project]
name = "travel-agent"
version = "0.1.0"
description = "TravelAgent offline foundation"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "jsonschema[format]==4.26.0",
    "PyYAML==6.0.3",
    "pydantic==2.13.5",
    "playwright==1.63.0",
    "platformdirs==4.11.12",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "uv==0.12.17",
    "ruff==0.16.8",
    "mypy==2.3.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["apps/api", "integrations/xhs-sidecar"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
files = ["integrations/xhs-sidecar/xhs_sidecar", "apps/api/travel_agent/research", "apps/api/travel_agent/preview", "apps/api/travel_agent/planning", "apps/api/travel_agent/providers/amap.py", "apps/api/travel_agent/providers/network_fence.py", "apps/api/travel_agent/providers/llm.py", "apps/api/travel_agent/providers/mock/llm.py"]
strict = true
python_version = "3.14"

[[tool.mypy.overrides]]
module = ["travel_agent.domain.models", "travel_agent.persistence.database", "travel_agent.persistence.repositories", "travel_agent.settings"]
follow_imports = "skip"
