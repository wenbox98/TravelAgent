openapi: 3.1.0
info:
  title: TravelAgent local API
  version: 0.1.1-design
  description: Design contract, not an implemented server. Loopback-only authenticated
    local application. Domain contracts now use NEED_LOGIN and VERIFICATION_REQUIRED;
    evidence includes source metadata, applicability and nullable confidence. PRIVATE_LOCAL_RESEARCH
    SourceContent and SourceBodyBlock are internal SQLite v5 contracts; v6 adds extraction
    attempts and safe diagnostics; v7 adds private per-candidate grounding/context
    review and partial-success states. v8 adds a single supplemental extraction authorization
    and transport-phase diagnostics. v10 extends the existing extraction authorizations
    and adds optional snapshot-bound span lineage and reviewed source roles. v9 adds
    a fixed research continuation ledger; optional ClaimAssessment route associations
    and historical author-trip scope remain private, source-anchored review metadata.
    These are not public HTTP response fields; no raw-content endpoint is added. P01
    /api/v1/preview routes are implemented; other business routes remain design contracts.
    SQLite v11 adds independent preview choices/receipts.
servers:
- url: http://127.0.0.1:8765
security:
- LocalSession: []
